services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zscript:Zscr!pt_P@ss_xK9m2026@postgres:5432/zscript
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zscript
      POSTGRES_PASSWORD: Zscr!pt_P@ss_xK9m2026
      POSTGRES_DB: zscript
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zscript -d zscript"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
